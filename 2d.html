<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>节拍飙车 · 涂鸦公路</title>
<style>
html,body{margin:0;height:100%;background:#2b2233;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);touch-action:none}
</style></head><body>
<canvas id="c" role="img" aria-label="节拍飙车：点击左中右三条车道，在音符到达车头时命中节拍"></canvas>
<script>
'use strict';
// ====================== 画布 / 竖屏自适应 ======================
const cv = document.getElementById('c'), cx = cv.getContext('2d');
const W = 720; let H = 1280, HZ = 410, YJ = 990, K = 1;
const Q = new URLSearchParams(location.search);
function resize() {
  const iw = innerWidth, ih = innerHeight;
  H = Math.round(Math.min(1560, Math.max(1180, W * ih / iw)));
  const s = Math.min(iw / W, ih / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  K = Math.min(2, s * (devicePixelRatio || 1));
  cv.width = Math.round(W * K); cv.height = Math.round(H * K);
  HZ = Math.round(H * .32); YJ = H - 290;
}
addEventListener('resize', resize); resize();

// ====================== 随机 / 手绘工具 ======================
function RNG(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(n) { n = Math.imul((n | 0) ^ 61 ^ ((n | 0) >>> 16), 9); n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); n ^= n >>> 15; return (n >>> 0) / 4294967296; }
let BOIL = 0, INK = '#2b2233';
const jt = k => hash(k * 7919 + BOIL * 104729) - .5;
const FONT = '"Comic Sans MS","Chalkboard SE","YouYuan","幼圆","Microsoft YaHei","PingFang SC",sans-serif';

// 手绘描边：同一路径抖动画两遍，每 1/8 秒“沸腾”一次
function wob(pts, close, col, w, amp, seed) {
  amp = amp == null ? 2 : amp; seed = seed || 0;
  cx.strokeStyle = col || INK; cx.lineJoin = cx.lineCap = 'round';
  for (let pass = 0; pass < 2; pass++) {
    cx.lineWidth = (w || 3) * (pass ? .5 : 1);
    cx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const k = seed + i * 13 + pass * 977, X = pts[i][0] + jt(k) * amp * 2, Y = pts[i][1] + jt(k + 5) * amp * 2;
      i ? cx.lineTo(X, Y) : cx.moveTo(X, Y);
    }
    if (close) cx.closePath();
    cx.stroke();
  }
}
function path(pts) { cx.beginPath(); pts.forEach((p, i) => i ? cx.lineTo(p[0], p[1]) : cx.moveTo(p[0], p[1])); cx.closePath(); }
function shape(pts, fill, w, amp, seed, col) { if (fill) { path(pts); cx.fillStyle = fill; cx.fill(); } if (w) wob(pts, true, col, w, amp, seed); }
function ellPts(x, y, rx, ry, n) { n = n || 18; const a = []; for (let i = 0; i < n; i++) { const t = i / n * Math.PI * 2; a.push([x + Math.cos(t) * rx, y + Math.sin(t) * ry]); } return a; }
function rrPts(x, y, w, h, r) { const a = [], n = 4; const c = [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]];
  for (const [ox, oy, a0] of c) for (let i = 0; i <= n; i++) { const t = a0 + i / n * Math.PI / 2; a.push([ox + Math.cos(t) * r, oy + Math.sin(t) * r]); } return a; }
function quad(a, b, c, d, e, f, g, h, col) { cx.beginPath(); cx.moveTo(a, b); cx.lineTo(c, d); cx.lineTo(e, f); cx.lineTo(g, h); cx.closePath(); cx.fillStyle = col; cx.fill(); }
function txt(s, x, y, size, fill, stroke, align, rot) {
  cx.save(); cx.translate(x, y); if (rot) cx.rotate(rot);
  cx.font = '900 ' + size + 'px ' + FONT; cx.textAlign = align || 'center'; cx.textBaseline = 'middle';
  if (stroke) { cx.lineJoin = 'round'; cx.lineWidth = Math.max(4, size * .16); cx.strokeStyle = stroke; cx.strokeText(s, 0, 0); }
  cx.fillStyle = fill; cx.fillText(s, 0, 0); cx.restore();
}
function hatch(pts, col, gap, w) { cx.save(); path(pts); cx.clip(); let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const p of pts) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
  cx.strokeStyle = col; cx.lineWidth = w || 2; cx.beginPath();
  for (let x = x0 - (y1 - y0); x < x1; x += gap) { cx.moveTo(x, y1); cx.lineTo(x + (y1 - y0), y0); } cx.stroke(); cx.restore(); }
function star(x, y, r, col, rot) { const a = []; for (let i = 0; i < 10; i++) { const t = rot + i * Math.PI / 5 - Math.PI / 2, rr = i & 1 ? r * .45 : r; a.push([x + Math.cos(t) * rr, y + Math.sin(t) * rr]); } shape(a, col, Math.max(1.5, r * .12), r * .04, 3); }
function heart(x, y, s, fill) { const a = []; for (let i = 0; i < 24; i++) { const t = i / 24 * Math.PI * 2; a.push([x + 16 * Math.pow(Math.sin(t), 3) * s / 16, y - (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * s / 16]); } shape(a, fill, 3.5, 1.2, 7); }

// ====================== 关卡 / 主题 ======================
const THEMES = [
  { sky: '#bfe6ff', sky2: '#fdf6e3', sun: '#ffd23f', mount: '#9ad0a0', grass: '#93d46e', grass2: '#82c65e', road: '#ece6d8', rumble: ['#ff5a5f', '#ffffff'], ink: '#2b2233', lines: '#ffffff', deco: 'town' },
  { sky: '#ffb37a', sky2: '#ffe3b8', sun: '#ff6b6b', mount: '#b98ae6', grass: '#f3d79f', grass2: '#ead08c', road: '#e0d5c6', rumble: ['#2ec4b6', '#ffffff'], ink: '#3a2430', lines: '#fffaf0', deco: 'beach' },
  { sky: '#1d1b3a', sky2: '#35306a', sun: '#ff4fd8', mount: '#3b3470', grass: '#26244c', grass2: '#211f43', road: '#3a3768', rumble: ['#ff4fd8', '#3ef0ff'], ink: '#f4f1e8', lines: '#3ef0ff', deco: 'neon', night: true },
  { sky: '#ff7b54', sky2: '#ffd56b', sun: '#fff3b0', mount: '#5c3d2e', grass: '#7f4e3b', grass2: '#704333', road: '#d3c5b6', rumble: ['#ffd23f', '#2b2233'], ink: '#2b1a1a', lines: '#fff3b0', deco: 'volcano' },
];
const LEVELS = [
  { name: '涂鸦小镇', bpm: 100, root: 60, th: 0, diff: 0, seed: 11 },
  { name: '黄昏海岸', bpm: 116, root: 62, th: 1, diff: 1, seed: 23 },
  { name: '霓虹夜城', bpm: 132, root: 57, th: 2, diff: 2, seed: 37 },
  { name: '火山狂飙', bpm: 150, root: 59, th: 3, diff: 3, seed: 51 },
];
const SECTIONS = [['intro', 4], ['a', 8], ['b', 6], ['drop', 8], ['out', 4]];
const LANEC = ['#ff5d8f', '#ffd23f', '#3ec1ff'];
const LEAD = 2.4, WP = .06, WG = .11, WO = .16;

// 由同一个种子同时生成“音乐”与“谱面”，保证每个音符都踩在鼓点/旋律上
function buildSong(L) {
  const r = RNG(L.seed), beat = 60 / L.bpm, s16 = beat / 4, d = L.diff, R = L.root;
  const prog = [0, 7, 9, 5], chords = [[0, 4, 7], [7, 11, 14], [9, 12, 16], [5, 9, 12]];
  const notes = [], mus = [], obs = []; let bar = 0, lane = 1, dir = 1;
  const M = (t, k, m, du) => mus.push({ t, k, m, d: du });
  for (const [sec, n] of SECTIONS) for (let b = 0; b < n; b++, bar++) {
    const t0 = LEAD + bar * 16 * s16, ci = bar % 4, ch = chords[ci], st = i => t0 + i * s16;
    // ---- 音乐 ----
    if (b === 0 && sec !== 'intro') M(t0, 'crash');
    const kick = sec === 'drop' ? [0, 4, 8, 12] : sec === 'b' ? [0, 6, 8] : sec === 'intro' ? (b < 2 ? [0] : [0, 8]) : [0, 8, d ? 10 : 99];
    kick.forEach(i => i < 16 && M(st(i), 'kick'));
    if (!(sec === 'intro' && b < 2)) [4, 12].forEach(i => M(st(i), 'snare'));
    if (sec === 'drop' && b === n - 1) [13, 14, 15].forEach(i => M(st(i), 'snare'));
    for (let i = 0; i < 16; i += (sec === 'drop' || sec === 'b') ? 1 : 2) M(st(i), (sec === 'drop' && i % 4 === 2) ? 'ohat' : 'hat');
    const bassStep = sec === 'intro' ? 16 : sec === 'a' ? 4 : 2;
    for (let i = 0; i < 16; i += bassStep) M(st(i), 'bass', R - 24 + prog[ci], s16 * bassStep * .9);
    ch.forEach(c => M(t0, 'pad', R - 12 + c, 16 * s16));
    if (sec === 'drop') for (let i = 0; i < 16; i++) M(st(i), 'arp', R + 12 + ch[i % 3] + (i % 6 > 2 ? 12 : 0));
    // ---- 谱面 ----
    let ev = [];
    if (sec === 'intro') ev = (b < 2 ? [0, 8] : [0, 4, 8, 12]).map(s => [s, 0]);
    else if (sec === 'a') { ev = [0, 4, 8, 12].map(s => [s, 0]); if (d >= 1 && r() < .5) ev.push([14, 0]); if (d >= 2 && r() < .55) ev.push([6, 0]); if (d >= 2 && r() < .4) ev.push([10, 0]); if (d >= 3 && r() < .5) ev.push([2, 0]); }
    else if (sec === 'b') { if (b % 2 === 0) { ev = [[0, 6], [8, 0], [12, 0]]; if (d >= 2) ev.push([14, 0]); } else ev = d >= 1 ? [[0, 0], [4, 0], [8, 6]] : [[0, 0], [4, 0], [8, 0], [12, 0]]; }
    else if (sec === 'drop') {
      if (d === 0) ev = [0, 4, 8, 12].concat(b % 2 ? [14] : []).map(s => [s, 0]);
      else if (d === 1) ev = [0, 4, 6, 8, 12, 14].map(s => [s, 0]);
      else { ev = [0, 2, 4, 6, 8, 10, 12, 14].filter(() => r() > .15).map(s => [s, 0]); if (!ev.length || ev[0][0]) ev.unshift([0, 0]); if (d >= 3 && r() < .6) ev.push([r() < .5 ? 7 : 13, 0]); }
      if (b === n - 1 && d >= 2) ev = ev.filter(e => e[0] < 12).concat([[12, 0], [13, 0], [14, 0], [15, 0]]);
    } else ev = b === n - 1 ? [[0, 12]] : [0, 4, 8, 12].map(s => [s, 0]);
    ev.sort((a, b) => a[0] - b[0]);
    let holdEnd = -1;
    for (const [s, len] of ev) {
      if (s < holdEnd) continue;
      // 车道：60% 换道，30% 走阶梯，保持可读
      const rr = r();
      if (rr < .3) { let nl = lane + dir; if (nl < 0 || nl > 2) { dir = -dir; nl = lane + dir; } lane = nl; }
      else if (rr < .65) { const o = [0, 1, 2].filter(x => x !== lane); lane = o[r() * 2 | 0]; }
      const t = st(s), nt = { t, lane, m: R + ch[lane] + 12, j: 0, sec };
      if (len) { nt.hold = 1; nt.t2 = st(s + len); nt.tk = 0; holdEnd = s + len + 2; }
      notes.push(nt);
    }
  }
  // 路障：放在玩家“刚离开”的车道上，半拍后到达 —— 跟着节奏换道就能躲开
  const rate = [.22, .32, .42, .5][d];
  const laneAt = t => { let l = 1; for (const n of notes) { if (n.t > t) break; l = n.lane; } return l; };
  for (let i = 1; i < notes.length; i++) {
    const a = notes[i - 1], b = notes[i];
    if (a.lane === b.lane || a.sec === 'intro' || r() > rate) continue;
    const t = (b.hold ? b.t : b.t) + beat * .5;
    if (obs.length && t - obs[obs.length - 1].t < beat * 1.5) continue;
    if (laneAt(t) === a.lane) continue;
    if (notes.some(n => n.lane === a.lane && (Math.abs(n.t - t) < .45 || (n.hold && n.t < t + .3 && n.t2 > t - .3)))) continue;
    obs.push({ t, lane: a.lane, kind: obs.length % 3 === 2 ? 1 : 0, done: 0 });
  }
  mus.sort((a, b) => a.t - b.t);
  const end = LEAD + bar * 16 * s16 + 1.6;
  return { notes, mus, obs, beat, end, holds: notes.filter(n => n.hold).length, spd: 14 + d * 2 };
}

// ====================== 存档 ======================
let SAVE = { best: [0, 0, 0, 0], stars: [0, 0, 0, 0], last: 0 };
try { const s = JSON.parse(localStorage.getItem('beatrush_v1')); if (s && s.best) SAVE = Object.assign(SAVE, s); } catch (e) { }
function persist() { try { localStorage.setItem('beatrush_v1', JSON.stringify(SAVE)); } catch (e) { } }
const unlocked = i => i === 0 || SAVE.stars[i - 1] > 0 || Q.has('auto');

// ====================== 音频（Web Audio 程序化合成） ======================
let AC = null, MASTER = null, BUS = null, NB = null, LAT = 0, T0 = 0, SP = 0;
function ensureAC() {
  if (AC || Q.has('auto')) { if (AC && AC.state === 'suspended' && !G.paused) AC.resume(); return; }
  const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
  AC = new C();
  const comp = AC.createDynamicsCompressor(); comp.connect(AC.destination);
  MASTER = AC.createGain(); MASTER.gain.value = .8; MASTER.connect(comp);
  NB = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate); const ch = NB.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(); s.buffer = AC.createBuffer(1, 1, 22050); s.connect(AC.destination); s.start(0); // iOS 解锁
  LAT = AC.outputLatency || AC.baseLatency || 0;
}
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
function env(g, t, a, peak, dec) { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + dec); }
function osc(type, f, t, dur, peak, dest, a) { a = a || .005; const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); env(g, t, a, peak, dur); o.connect(g); g.connect(dest); o.start(t); o.stop(t + a + dur + .05); return o; }
function noise(t, dur, peak, ft, fq, dest) { const s = AC.createBufferSource(); s.buffer = NB; const f = AC.createBiquadFilter(); f.type = ft; f.frequency.value = fq; const g = AC.createGain(); env(g, t, .002, peak, dur); s.connect(f); f.connect(g); g.connect(dest); s.start(t, Math.random() * 1.5); s.stop(t + dur + .05); }
function play(e, t, dest) {
  switch (e.k) {
    case 'kick': { const o = osc('sine', 150, t, .28, .9, dest); o.frequency.exponentialRampToValueAtTime(42, t + .12); break; }
    case 'snare': noise(t, .16, .4, 'highpass', 1400, dest); osc('triangle', 190, t, .08, .22, dest); break;
    case 'hat': noise(t, .03, .1, 'highpass', 7500, dest); break;
    case 'ohat': noise(t, .15, .08, 'highpass', 6500, dest); break;
    case 'crash': noise(t, 1.1, .16, 'highpass', 4000, dest); break;
    case 'bass': { const o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain(); o.type = 'sawtooth'; o.frequency.value = mf(e.m); f.type = 'lowpass'; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(200, t + e.d); env(g, t, .008, .2, e.d); o.connect(f); f.connect(g); g.connect(dest); o.start(t); o.stop(t + e.d + .1); break; }
    case 'pad': osc('triangle', mf(e.m), t, e.d, .045, dest, .25); break;
    case 'arp': osc('square', mf(e.m), t, .08, .03, dest); break;
  }
}
function sfx(k, m) {
  if (!AC) return; const t = AC.currentTime + .005;
  if (k === 'hit') { osc('triangle', mf(m), t, .35, .28, MASTER); osc('square', mf(m + 12), t, .1, .05, MASTER); }
  else if (k === 'tick') osc('sine', mf(m + 12), t, .08, .12, MASTER);
  else if (k === 'crash') { noise(t, .5, .6, 'lowpass', 900, MASTER); osc('sawtooth', 90, t, .3, .25, MASTER); }
  else if (k === 'fever') [0, 4, 7, 12, 16].forEach((x, i) => osc('square', mf(72 + x), t + i * .06, .15, .08, MASTER));
  else if (k === 'end') [0, 4, 7, 12].forEach((x, i) => osc('triangle', mf((m || 72) + x), t + i * .12, .4, .2, MASTER));
  else if (k === 'ui') osc('triangle', 880, t, .06, .1, MASTER);
}
setInterval(() => {
  if (!AC || !G.started || G.paused || G.over || !BUS) return;
  const ahead = AC.currentTime - T0 + .2, mus = G.song.mus;
  while (SP < mus.length && mus[SP].t < ahead) { play(mus[SP], Math.max(AC.currentTime, T0 + mus[SP].t), BUS); SP++; }
}, 25);

// ====================== 游戏状态 ======================
const G = {};
function reset(lv, autoStart) {
  G.lv = lv; SAVE.last = lv; const L = LEVELS[lv];
  Object.assign(G, { song: buildSong(L), now: 0, started: false, paused: false, over: false, ui: null, result: null,
    score: 0, combo: 0, maxCombo: 0, hearts: 3, energy: 0, feverEnd: -1, cnt: { p: 0, g: 0, o: 0, m: 0 }, ni: 0, oi: 0,
    car: { lane: 1, x: W / 2, tilt: 0, crash: 0 }, hold: null, fx: [], pops: [], shake: 0, flash: [0, 0, 0], ring: [0, 0, 0], failAt: 0, comboPop: 0, idle: G.idle || 0 });
  if (BUS) BUS.disconnect(); BUS = null;
  if (autoStart) startRun();
}
function startRun() {
  if (G.started) return; G.started = true; G.now = 0; SP = 0;
  if (AC) { BUS = AC.createGain(); BUS.gain.value = .55; BUS.connect(MASTER); T0 = AC.currentTime + .08; }
}
const fever = () => G.now < G.feverEnd;
const mult = () => (1 + Math.min(G.combo, 100) / 50) * (fever() ? 2 : 1);
function pop(s, x, y, c, size) { G.pops.push({ s, x, y, c, size: size || 46, t: G.now, rot: (Math.random() - .5) * .3 }); }
function burst(x, y, c, n, kind) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = 200 + Math.random() * 420; G.fx.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 200, life: .6 + Math.random() * .3, max: .9, c, kind: kind || (i % 3 ? 'dot' : 'star'), r: 6 + Math.random() * 10, rot: Math.random() * 6 }); } }
const laneScreenX = l => W / 2 + (l - 1) * 200;

function addCombo(grade, base, x) {
  G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo); G.comboPop = 1;
  G.score += Math.round(base * mult());
  if (!fever()) { G.energy += grade === 'p' ? 5 : grade === 'g' ? 3 : 1; if (G.energy >= 100) { G.energy = 0; G.feverEnd = G.now + 8; sfx('fever'); pop('FEVER!!', W / 2, HZ + 90, '#ff4fd8', 72); } }
}
function hit(n, ad, id) {
  const g = ad <= WP ? 'p' : ad <= WG ? 'g' : 'o'; n.j = g; G.cnt[g]++;
  addCombo(g, g === 'p' ? 300 : g === 'g' ? 180 : 80);
  const x = laneScreenX(n.lane);
  pop(g === 'p' ? 'PERFECT!' : g === 'g' ? 'GREAT' : 'GOOD', x, YJ - 120, g === 'p' ? '#ffd23f' : g === 'g' ? '#7ee081' : '#9ecbff', g === 'p' ? 50 : 42);
  burst(x, YJ, LANEC[n.lane], g === 'p' ? 14 : 8); G.ring[n.lane] = 1;
  sfx('hit', n.m);
  if (n.hold) { G.hold = { n, id }; n.holding = 1; }
}
function miss(n) {
  n.j = 'm'; G.cnt.m++; if (n.hold) { G.cnt.m++; n.done = 1; }
  G.combo = 0; G.energy = Math.max(0, G.energy - 8);
  pop('MISS', laneScreenX(n.lane), YJ - 110, '#b8b0c8', 40);
}
function holdDone(ok) {
  const n = G.hold.n; n.done = 1; n.holding = 0; G.hold = null;
  if (ok) { G.cnt.p++; addCombo('p', 220); pop('漂移完成!', laneScreenX(n.lane), YJ - 170, '#ff9f1c', 44); burst(laneScreenX(n.lane), YJ, '#ff9f1c', 16); sfx('hit', n.m + 7); }
  else { G.cnt.m++; G.combo = 0; pop('断了…', laneScreenX(n.lane), YJ - 150, '#b8b0c8', 40); }
}
function press(lane, id) {
  if (!G.started || G.over || G.paused) return;
  G.flash[lane] = 1;
  if (G.car.lane !== lane) { G.car.lane = lane; if (G.hold) holdDone(false); }
  const ns = G.song.notes; let best = null, bd = 1;
  for (let i = G.ni; i < ns.length; i++) { const n = ns[i]; if (n.t - G.now > WO) break; if (n.j || n.lane !== lane) continue; const ad = Math.abs(G.now - n.t); if (ad <= WO && ad < bd) { best = n; bd = ad; } }
  if (best) hit(best, bd, id);
}
function release(id) {
  if (!G.hold || G.hold.id !== id) return;
  holdDone(G.now >= G.hold.n.t2 - .15);
}
function update() {
  const S = G.song, ns = S.notes, now = G.now;
  for (let i = G.ni; i < ns.length; i++) { const n = ns[i]; if (n.t > now) break; if (!n.j && now - n.t > WO) miss(n); }
  while (G.ni < ns.length && ns[G.ni].j && (!ns[G.ni].hold || ns[G.ni].done)) G.ni++;
  if (G.hold) {
    const n = G.hold.n, k = Math.floor((now - n.t) / S.beat);
    while (n.tk < k && n.t + (n.tk + 1) * S.beat < n.t2 - .05) { n.tk++; G.score += Math.round(50 * mult()); G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo); G.comboPop = 1; sfx('tick', n.m); burst(laneScreenX(n.lane), YJ + 40, '#ff9f1c', 4, 'dot'); }

    const o = S.obs[i]; if (o.t > now) break; if (o.done) { if (i === G.oi) G.oi++; continue; }
    o.done = 1;
    if (G.car.lane === o.lane) {
      G.hearts--; G.combo = 0; G.shake = .5; G.car.crash = .7; sfx('crash');
      pop('砰!', laneScreenX(o.lane), YJ - 160, '#ff5a5f', 70); burst(laneScreenX(o.lane), YJ - 20, INK, 18, 'dot');
      if (G.hold) holdDone(false);
      if (G.hearts <= 0) G.failAt = now + .9;

  }

}
function finish(ok) {
  if (G.over) return; G.over = true; if (G.hold) { G.hold.n.holding = 0; G.hold = null; }
  const c = G.cnt, tot = G.song.notes.length + G.song.holds;

  const rank = !ok ? 'F' : acc >= .95 ? 'S' : acc >= .85 ? 'A' : acc >= .7 ? 'B' : 'C';
  const stars = !ok ? 0 : acc >= .95 ? 3 : acc >= .85 ? 2 : 1;
  const nb = G.score > SAVE.best[G.lv];

  if (!Q.has('auto')) { if (nb) SAVE.best[G.lv] = G.score; SAVE.stars[G.lv] = Math.max(SAVE.stars[G.lv], stars); persist(); }

  openUI('result');
}

// ====================== UI 面板 ======================

    B.push({ x: 275, y: 930, w: 170, h: 84, label: '选关', c: '#bfe6ff', act: () => openUI('select') });
    const nx = G.lv + 1;
    if (nx < LEVELS.length) B.push({ x: 470, y: 930, w: 170, h: 84, label: '下一关', c: unlocked(nx) ? '#7ee081' : '#d6d0c4', act: () => unlocked(nx) && reset(nx, true) });
  } else if (type === 'pause') {
    B.push({ x: 160, y: 520, w: 400, h: 96, label: '继续', c: '#7ee081', act: resume });
    B.push({ x: 160, y: 640, w: 400, h: 96, label: '重来', c: '#ffd23f', act: () => reset(G.lv, true) });
    B.push({ x: 160, y: 760, w: 400, h: 96, label: '选关', c: '#bfe6ff', act: () => openUI('select') });
  } else if (type === 'select') {
    LEVELS.forEach((L, i) => B.push({ x: 80, y: 330 + i * 150, w: 560, h: 130, lv: i, c: unlocked(i) ? '#fffaf0' : '#e4ddd0', act: () => unlocked(i) && reset(i, true) }));

}

  // 倒计时
  if (G.started && !G.over && G.now < LEAD + .3) { const b = G.song.beat, n = Math.ceil((LEAD - G.now) / b); if (n >= 1 && n <= 3) txt(String(n), W / 2, HZ + 150, 140, '#fffaf0', out); else if (G.now >= LEAD - .05) txt('GO!', W / 2, HZ + 150, 130, '#7ee081', out, 'center', -.08); }
  // 底部车道提示

}

// ====================== 主循环 ======================
let last = performance.now(), BR = RNG(99), CRASH = null;
function bot() { // 自动演示（截图 / 演示用）
  const ns = G.song.notes;
  if (CRASH && !CRASH.done && CRASH.t - G.now < .3) { G.car.lane = CRASH.lane; return; }
  for (let i = G.ni; i < ns.length; i++) { const n = ns[i]; if (n.t > G.now + .2) break; if (n.j) continue; if (n.bt == null) n.bt = n.t + (BR() - .4) * .09; if (G.now >= n.bt) press(n.lane, 'bot'); }
}
function step(dt) {
  BOIL = Math.floor(performance.now() / 125);
  if (G.started && !G.paused && !G.over) {
    if (AC && BUS) G.now = AC.currentTime - T0 - LAT; else G.now += dt;
    if (Q.has('auto')) bot();
    update();
  } else if (!G.started) G.idle += dt * 3;
  const tx = laneScreenX(G.car.lane); G.car.x += (tx - G.car.x) * Math.min(1, dt * 20); G.car.tilt = (tx - G.car.x) / LW * .35;
  G.car.crash = Math.max(0, G.car.crash - dt); G.shake = Math.max(0, G.shake - dt); G.comboPop = Math.max(0, G.comboPop - dt * 5);
  for (let l = 0; l < 3; l++) { G.flash[l] = Math.max(0, G.flash[l] - dt * 5); G.ring[l] = Math.max(0, G.ring[l] - dt * 3); }
  for (const f of G.fx) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 900 * dt; f.life -= dt; f.rot += dt * 5; }
  G.fx = G.fx.filter(f => f.life > 0); G.pops = G.pops.filter(p => G.now - p.t < .7 && G.now >= p.t - .01);
}
function render() {
  const th = THEMES[LEVELS[G.lv].th], S = G.song, now = G.now; INK = th.ink;
  const dist = G.idle + Math.max(0, now) * S.spd;
  CURVE = Math.sin(dist * .011) * .8 + Math.sin(dist * .027 + 1) * .35;
  const ph = ((now - LEAD) / S.beat) % 1, pulse = G.started && now > 0 ? Math.max(0, 1 - (ph < 0 ? ph + 1 : ph) * 4) : 0;
  cx.setTransform(K, 0, 0, K, 0, 0);
  if (G.shake > 0) cx.translate((Math.random() - .5) * 30 * G.shake, (Math.random() - .5) * 30 * G.shake);
  drawSky(th, now, pulse);
  drawRoad(th, dist);
  // 判定圈
  for (let l = 0; l < 3; l++) { const x = Xd(0, (l - 1) * LW), e = ellPts(x, YJ, 74 + G.ring[l] * 30, 27 + G.ring[l] * 10, 18);
    cx.globalAlpha = .35 + G.flash[l] * .5; shape(e, LANEC[l], 0); cx.globalAlpha = 1; wob(e, true, th.ink, 4 + pulse * 2, 1.4, 120 + l); }
  // 深度排序：物件 / 音符 / 路障
  const items = [];
  for (let j = Math.floor((dist - 3) / 5); j <= Math.floor((dist + DMAX) / 5); j++) for (const side of [-1, 1]) {
    const h = hash(j * 2 + (side > 0 ? 1 : 0) + G.lv * 1000), d = j * 5 + (side > 0 ? 2.5 : 0) - dist; if (d < -2.2 || d > DMAX || h > .8 && th.deco === 'town') continue;
    items.push({ d, f: () => { const p = P(d); deco(th, Xd(d, side * (RW + 120 + hash(j * 7 + side) * 150)), Yp(p), p, h, side); } });
  }
  for (const n of S.notes) { if (n.hold) { if (!n.done || n.holding) { const de = (n.t2 - now) * S.spd; if (de > -2 && (n.t - now) * S.spd < DMAX) items.push({ d: Math.max(0, (n.t - now) * S.spd) + .01, f: () => drawHold(n, now, S.spd, th) }); } }
    if (n.j && n.j !== 'm') continue; const d = (n.t - now) * S.spd; if (d > DMAX) break; if (d < -2 || n.holding) continue; items.push({ d, f: () => drawNote(n, d, th) }); }
  for (const o of S.obs) { const d = (o.t - now) * S.spd; if (d > DMAX) break; if (d < -2.2) continue; items.push({ d, f: () => drawObs(o, d, th) }); }
  items.sort((a, b) => b.d - a.d);
  for (const it of items) it.f();
  drawCar(th, now, pulse);
  // 速度线 / FEVER 边框
  if (fever() || G.combo >= 30) { cx.strokeStyle = fever() ? 'rgba(255,79,216,.55)' : 'rgba(255,255,255,.5)'; cx.lineWidth = 4;
    for (let i = 0; i < 16; i++) { const a = hash(i * 13) * Math.PI - Math.PI, r0 = 260 + ((now * 900 + hash(i) * 600) % 600); const ox = W / 2, oy = HZ;
      const ang = (i % 2 ? 1 : -1) * (.15 + hash(i * 3) * 1.2) + Math.PI / 2; cx.beginPath(); cx.moveTo(ox + Math.cos(ang) * r0, oy + Math.sin(ang) * r0); cx.lineTo(ox + Math.cos(ang) * (r0 + 120), oy + Math.sin(ang) * (r0 + 120)); cx.stroke(); } }
  if (fever()) { const cols = ['#ff4fd8', '#ffd23f', '#3ef0ff', '#7ee081']; wob(rrPts(8, 8, W - 16, H - 16, 30), true, cols[Math.floor(now * 8) % 4], 10, 3, 200); }
  // 粒子 & 判定字
  for (const f of G.fx) { cx.globalAlpha = Math.min(1, f.life / .3); if (f.kind === 'star') star(f.x, f.y, f.r * 1.6, f.c, f.rot); else { cx.fillStyle = f.c; cx.beginPath(); cx.arc(f.x, f.y, f.r * .6, 0, 7); cx.fill(); } cx.globalAlpha = 1; }
  for (const p of G.pops) { const a = (now - p.t) / .7, sc = a < .15 ? .5 + a / .15 * .7 : 1.2 - (a - .15) * .3; cx.save(); cx.globalAlpha = Math.max(0, 1 - Math.max(0, a - .6) * 2.5); cx.translate(p.x, p.y - a * 60); cx.scale(sc, sc); txt(p.s, 0, 0, p.size, p.c, '#2b2233', 'center', p.rot); cx.restore(); }
  drawHUD(th, now, pulse);
  if (!G.started && !G.ui) drawStart(th, performance.now() / 1000);
  if (G.ui) drawUI(th);
}
function loop(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; step(dt); render(); requestAnimationFrame(loop); }

// ====================== 启动：打开即进入赛道 ======================
G.idle = 0;
reset(Q.has('lv') ? Math.min(3, +Q.get('lv')) : Math.min(SAVE.last || 0, 3), false);
if (Q.has('auto')) { // 截图/演示：快进到指定时间
  startRun(); let T = Q.has('res') ? 1e9 : +(Q.get('t') || 10);
  if (Q.has('crash')) { CRASH = G.song.obs.find(o => o.t > +Q.get('crash')); T = CRASH.t + .12; }
  while (!G.over && G.now < T) step(1 / 60);
  if (Q.has('fever') && !G.over) { G.feverEnd = G.now + 6; }
  if (Q.has('ui')) openUI(Q.get('ui'));
  if (Q.has('freeze')) { G.paused = true; }
}
if (Q.has('select')) openUI('select');
requestAnimationFrame(loop);
setTimeout(() => window.DONE = true, 600);
</script>
